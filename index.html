<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cord Blood Awareness</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f4f4;
    }
    .container {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 400px;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    form {
      display: flex;
      flex-direction: column;
    }
    label {
      font-weight: bold;
      margin-top: 10px;
    }
    input, button {
      padding: 10px;
      margin-top: 5px;
      font-size: 1em;
    }
    button {
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      margin-top: 20px;
      cursor: pointer;
    }
    button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Cord Blood Awareness</h2>
    <form action="https://script.google.com/a/macros/lifecell.in/s/AKfycbwSp00okQqFkKRMWv1JughZtDGpxVshD4iczOxA9GkBaJ0ME3DUVZE01lTiky1a6SqTqw/exec" method="POST">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>

      <label for="contact">Contact Number</label>
      <input type="tel" id="contact" name="contact" pattern="[0-9]{10}" required placeholder="e.g. 9876543210">

      <label for="due-date">Expected Due Date</label>
      <input type="date" id="due-date" name="due-date" required>

      <button type="submit">Submit</button>
    </form>
  </div>
</body>
</html>
